<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClassWeb · 班级主页</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
        body {
            min-height: 100vh;
            background: radial-gradient(1200px 600px at 50% -10%, #1e3a5f 0%, #12161c 55%, #0d0f13 100%);
            color: #e6ebf2;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 24px 18px;
        }
        .card {
            width: 100%; max-width: 560px;
            background: rgba(30, 36, 45, 0.78);
            border: 1px solid rgba(120, 150, 190, 0.25);
            border-radius: 20px;
            padding: 34px 26px;
            text-align: center;
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(6px);
        }
        h1 { font-size: 2rem; letter-spacing: 1px; color: #6ea8fe; margin-bottom: 10px; }
        .sub { color: #9aa8ba; font-size: .95rem; line-height: 1.7; margin-bottom: 26px; }
        .box {
            background: #222a35;
            border-radius: 14px;
            padding: 18px 16px;
            margin-bottom: 18px;
            border: 1px solid rgba(120, 150, 190, 0.15);
        }
        .box .label { color: #8f9db1; font-size: .85rem; margin-bottom: 8px; }
        .value { color: #38d39f; font-size: 1.15rem; font-weight: 700; letter-spacing: .5px; word-break: break-all; }
        .note { color: #f0b46a; font-size: .8rem; margin-top: 10px; line-height: 1.6; }
        .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 6px; }
        .tag { font-size: .78rem; color: #a9b6c9; background: #2a333f; border-radius: 999px; padding: 6px 12px; }
        .foot { margin-top: 26px; color: #6f7c8d; font-size: .76rem; }
    </style>
</head>
<body>
    <main class="card">
        <h1>ClassWeb</h1>
        <p class="sub">班级主页 · 静态站点<br>托管于 GitHub Pages</p>

        <div class="box">
            <div class="label">站点域名</div>
            <div class="value">classweb.de5.net</div>
        </div>

        <div class="box">
            <div class="label">Minecraft 服务器</div>
            <div class="value">play.de5.net</div>
            <p class="note">连接需支持 IPv6 的网络；服务器与本站分离，不影响网页访问</p>
        </div>

        <div class="row">
            <span class="tag">静态 HTML</span>
            <span class="tag">免备案</span>
            <span class="tag">HTTPS 自动</span>
        </div>

        <p class="foot">页面正常即为部署成功 · 如需内容修改可直接替换 index.html</p>
    </main>
</body>
</html>
