<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>班级网站访问验证</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  body{
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
    background:linear-gradient(135deg,#1d4ed8 0%,#2563eb 45%,#3b82f6 100%);
  }
  .box{background:#fff;width:100%;max-width:380px;border-radius:18px;padding:34px 26px 28px;
    box-shadow:0 18px 46px rgba(15,23,42,.28)}
  .ico{width:46px;height:46px;border-radius:12px;background:#e8f0ff;color:#2563eb;
    display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:22px}
  h1{font-size:1.22rem;color:#18212f;text-align:center;letter-spacing:.5px}
  .sub{font-size:.84rem;color:#69737f;text-align:center;margin-top:8px;line-height:1.6}
  label{display:block;font-size:.8rem;color:#69737f;margin:22px 0 7px}
  input[type=password]{width:100%;padding:12px 14px;font-size:16px;color:#18212f;
    border:1px solid #dbe3ee;border-radius:10px;background:#f8fafd;outline:none;transition:.2s}
  input[type=password]:focus{border-color:#2563eb;background:#fff;box-shadow:0 0 0 3px #e8f0ff}
  button{width:100%;margin-top:18px;padding:13px;font-size:15px;font-weight:600;letter-spacing:1px;
    color:#fff;border:none;border-radius:10px;cursor:pointer;
    background:linear-gradient(135deg,#2563eb,#3b82f6);box-shadow:0 8px 20px rgba(37,99,235,.28);
    transition:.2s}
  button:hover{filter:brightness(1.05)}
  button:disabled{opacity:.65;cursor:not-allowed;box-shadow:none}
  .row{display:flex;align-items:center;gap:7px;margin-top:14px;font-size:.8rem;color:#69737f}
  .row input{width:15px;height:15px;accent-color:#2563eb}
  .tip{margin-top:12px;min-height:18px;text-align:center;font-size:.8rem;color:#e5484d}
  .foot{margin-top:20px;text-align:center;font-size:.72rem;color:#98a2b3;line-height:1.7}
</style>
</head>
<body>
<form class="box" id="box" autocomplete="off">
  <div class="ico">🔒</div>
  <h1>班级网站访问验证</h1>
  <p class="sub">本站内容已加密，请输入班级访问密码后查看</p>
  <label for="pw">访问密码</label>
  <input type="password" id="pw" placeholder="请输入密码" required>
  <label class="row"><input type="checkbox" id="rm"> 记住密码（本设备）</label>
  <button type="submit" id="btn">进入班级主页</button>
  <p class="tip" id="tip"></p>
  <p class="foot">ClassWeb · 受保护页面<br>仅限本班成员访问</p>
</form>

const $ = id => document.getElementById(id);
function b64d(s){
  const bin = atob(s), len = bin.length, u8 = new Uint8Array(len);
  for (let i = 0; i < len; i++) u8[i] = bin.charCodeAt(i);
  return u8;
}
async function deriveKey(pwd){
  const raw = new TextEncoder().encode(pwd);
  const base = await crypto.subtle.importKey('raw', raw, {name:'PBKDF2'}, false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2', salt:b64d(D.s), iterations:D.it, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, ['decrypt']
  );
}
async function unlock(pwd){
  const key = await deriveKey(pwd);
  const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64d(D.i)}, key, b64d(D.d));
  return new TextDecoder().decode(plain);
}
async function open(pwd, remember){
  if (remember) localStorage.setItem('cw_pw', pwd); else localStorage.removeItem('cw_pw');
  const html = await unlock(pwd);
  document.open();
  document.write(html);
  document.close();
}
$('box').addEventListener('submit', async e => {
  e.preventDefault();
  // 宽容处理：去掉首尾空格、统一小写，避免手机键盘自动大写/误加空格导致验证失败
  const pwd = $('pw').value.trim().toLowerCase();
  if (!pwd) return;
  $('pw').value = pwd;
  const btn = $('btn');
  btn.disabled = true; btn.textContent = '验证中…'; $('tip').textContent = '';
  try {
    await open(pwd, $('rm').checked);
  } catch (err) {
    btn.disabled = false; btn.textContent = '进入班级主页';
    $('tip').textContent = '密码错误，请重新输入';
    $('pw').select();
  }
});
(async () => {
  const saved = localStorage.getItem('cw_pw');
  if (saved) {
    try { await open(saved, true); } catch (e) { localStorage.removeItem('cw_pw'); }
  }
})();
</script>
