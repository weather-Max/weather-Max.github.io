<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>班级网站登录</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
    background:linear-gradient(135deg,#1d4ed8 0%,#2563eb 45%,#3b82f6 100%)}
  .box{background:#fff;width:100%;max-width:390px;border-radius:18px;padding:30px 26px 26px;
    box-shadow:0 18px 46px rgba(15,23,42,.28)}
  .ico{width:46px;height:46px;border-radius:12px;background:#e8f0ff;color:#2563eb;
    display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:22px}
  h1{font-size:1.2rem;color:#18212f;text-align:center;letter-spacing:.5px}
  .sub{font-size:.83rem;color:#69737f;text-align:center;margin-top:8px;line-height:1.6}
  .tabs{display:flex;margin:20px 0 4px;background:#f1f5fb;border-radius:10px;padding:4px}
  .tabs button{flex:1;border:none;background:transparent;padding:9px;font-size:.86rem;color:#69737f;
    border-radius:8px;cursor:pointer;font-weight:600;transition:.2s}
  .tabs button.on{background:#fff;color:#2563eb;box-shadow:0 2px 8px rgba(37,99,235,.16)}
  label{display:block;font-size:.8rem;color:#69737f;margin:16px 0 7px}
  input[type=text],input[type=password]{width:100%;padding:12px 14px;font-size:16px;color:#18212f;
    border:1px solid #dbe3ee;border-radius:10px;background:#f8fafd;outline:none;transition:.2s}
  input:focus{border-color:#2563eb;background:#fff;box-shadow:0 0 0 3px #e8f0ff}
  .btn{width:100%;margin-top:18px;padding:13px;font-size:15px;font-weight:600;letter-spacing:1px;
    color:#fff;border:none;border-radius:10px;cursor:pointer;
    background:linear-gradient(135deg,#2563eb,#3b82f6);box-shadow:0 8px 20px rgba(37,99,235,.28)}
  .btn:disabled{opacity:.65;cursor:not-allowed;box-shadow:none}
  .row{display:flex;align-items:center;gap:7px;margin-top:14px;font-size:.8rem;color:#69737f}
  .row input{width:15px;height:15px;accent-color:#2563eb}
  .tip{margin-top:12px;min-height:18px;text-align:center;font-size:.8rem;color:#e5484d}
  .foot{margin-top:18px;text-align:center;font-size:.72rem;color:#98a2b3;line-height:1.7}
  .note{background:#f7faff;border:1px solid #e2ecfb;border-radius:12px;padding:14px;margin-top:16px;
    font-size:.82rem;color:#425466;line-height:1.75}
  .note b{color:#2563eb}
  .hide{display:none}
</style>
</head>
<body>
<div class="box">
  <div class="ico">👥</div>
  <h1>班级网站登录</h1>
  <p class="sub">本站内容已加密，登录后自动解密显示</p>
  <div class="tabs">
    <button id="tabLogin" class="on">登录</button>
    <button id="tabReg">注册</button>
  </div>

  <form id="paneLogin" autocomplete="off">
    <label for="user">用户名</label>
    <input type="text" id="user" placeholder="例如 s01" required>
    <label for="pw">密码</label>
    <input type="password" id="pw" placeholder="请输入班级分配的密码" required>
    <label class="row"><input type="checkbox" id="rm"> 记住我（本设备免输入）</label>
    <button type="submit" class="btn" id="btn">登录并进入</button>
    <p class="tip" id="tip"></p>
  </form>

  <div id="paneReg" class="hide">

    </div>
    <p class="foot">密码由管理员单独发放，请勿转发到公开场合</p>
  </div>

const $ = id => document.getElementById(id);
const b64d = s => {
  const bin = atob(s), n = bin.length, u8 = new Uint8Array(n);
  for (let i = 0; i < n; i++) u8[i] = bin.charCodeAt(i);
  return u8;
};
const norm = v => (v || '').trim().toLowerCase();
function findUser(u){
  for (const row of USERS.split(';')) {
    const p = row.split('|');
    if (p[0] === u) return {salt:p[1], iv:p[2], wrap:p[3]};
  }
  return null;
}
async function unlock(u, pwd){
  const rec = findUser(u);
  if (!rec) throw new Error('nouser');
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(norm(pwd)),
    {name:'PBKDF2'}, false, ['deriveKey']);
  const kek = await crypto.subtle.deriveKey(
    {name:'PBKDF2', salt:b64d(rec.salt), iterations:IT, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, ['decrypt', 'encrypt']);
  const rawKey = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64d(rec.iv)}, kek, b64d(rec.wrap));
  const ck = await crypto.subtle.importKey('raw', rawKey, {name:'AES-GCM'}, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64d(CT.i)}, ck, b64d(CT.d));
  return new TextDecoder().decode(plain);
}
async function enter(u, pwd, remember){
  const html = await unlock(u, pwd);
  if (remember) localStorage.setItem('cw_acct', JSON.stringify({u, p:pwd}));
  else localStorage.removeItem('cw_acct');
  document.open(); document.write(html); document.close();
}

// tabs
$('tabLogin').onclick = () => {
  $('tabLogin').classList.add('on'); $('tabReg').classList.remove('on');
  $('paneLogin').classList.remove('hide'); $('paneReg').classList.add('hide');
};
$('tabReg').onclick = () => {
  $('tabReg').classList.add('on'); $('tabLogin').classList.remove('on');
  $('paneReg').classList.remove('hide'); $('paneLogin').classList.add('hide');
};
$('copyBtn').onclick = async () => {
  const t = $('reqText').textContent.trim();
  try { await navigator.clipboard.writeText(t); $('copyBtn').textContent = '已复制 ✓'; }
  catch (e) { prompt('请手动复制：', t); }
};

$('paneLogin').addEventListener('submit', async e => {
  e.preventDefault();
  const u = norm($('user').value), pwd = norm($('pw').value);
  if (!u || !pwd) return;
  const btn = $('btn');
  btn.disabled = true; btn.textContent = '验证中…'; $('tip').textContent = '';
  try {
    await enter(u, pwd, $('rm').checked);
  } catch (err) {
    btn.disabled = false; btn.textContent = '登录并进入';
    $('tip').textContent = err.message === 'nouser' ? '用户名不存在' : '用户名或密码错误';
  }
});

(async () => {
  const saved = localStorage.getItem('cw_acct');
  if (!saved) return;
  try {
    const o = JSON.parse(saved);
    await enter(o.u, o.p, true);
  } catch (e) { localStorage.removeItem('cw_acct'); }
})();
</script>
